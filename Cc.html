<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{--bordeaux:#340a12;--bordeaux-clair:#6b1a2a;--creme:#f1e8df;--blanc:#fff;--doux:rgba(52,10,18,.45)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--bordeaux);display:flex;justify-content:center;padding:2px}
  .cadre{width:100%;max-width:210px}
  .arche{border:1.5px solid var(--bordeaux);border-radius:500px 500px 0 0;background:var(--blanc);padding:5px}
  .interieur{background:var(--creme);border-radius:500px 500px 0 0;padding:22px 8px 8px}
  .mois{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
  .mois h1{font-style:italic;font-weight:500;font-size:13px;text-transform:capitalize}
  .fleche{background:none;border:none;font-family:inherit;font-size:14px;color:var(--bordeaux);cursor:pointer;width:16px;height:16px}
  .fleche:focus-visible,.jour:focus-visible,.ajout button:focus-visible{outline:1.5px solid var(--bordeaux);outline-offset:1px}
  .grille{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
  .nom-jour{font-size:9px;font-style:italic;color:var(--doux)}
  .jour{position:relative;background:none;border:none;font-family:inherit;font-size:10px;color:var(--bordeaux);height:16px;border-radius:50%;cursor:pointer;line-height:16px}
  .jour.autre{visibility:hidden}
  .jour.aujourdhui{background:var(--bordeaux);color:var(--creme);font-weight:600}
  .jour.choisi:not(.aujourdhui){box-shadow:inset 0 0 0 1px var(--bordeaux)}
  .jour.evenement::after{content:'';position:absolute;bottom:0;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--bordeaux-clair)}
  .jour.aujourdhui.evenement::after{background:var(--creme)}
  .detail{margin-top:4px;padding-top:4px;border-top:1px solid rgba(52,10,18,.2)}
  .detail h2{font-style:italic;font-weight:500;font-size:11px;text-align:center}
  .liste{list-style:none;max-height:30px;overflow-y:auto}
  .liste li{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;line-height:1.3}
  .liste li button{background:none;border:none;color:var(--doux);font-size:11px;cursor:pointer;padding-left:4px}
  .vide{font-size:10px;font-style:italic;color:var(--doux);text-align:center;display:block!important}
  .ajout{display:flex;gap:3px;margin-top:3px}
  .ajout input{flex:1;min-width:0;font-family:inherit;font-size:11px;color:var(--bordeaux);background:var(--blanc);border:1px solid rgba(52,10,18,.3);border-radius:9px;padding:1px 6px}
  .ajout input::placeholder{color:var(--doux);font-style:italic}
  .ajout input:focus{outline:1px solid var(--bordeaux)}
  .ajout button{font-family:inherit;font-size:12px;background:var(--bordeaux);color:var(--creme);border:none;border-radius:9px;padding:0 7px;cursor:pointer}

  body{flex-direction:column;align-items:center}
  .musique{width:100%;max-width:210px;margin-top:4px;display:flex;align-items:stretch;gap:4px;background:#340a12;border:1.5px solid #1f050a;border-radius:10px;padding:3px}
  .musique .deco{flex:none;width:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(241,232,223,.55);font-size:10px;line-height:1}
  .musique .deco svg{width:10px;height:10px;fill:#f1e8df}
  .musique iframe{display:block;flex:1;min-width:0;height:80px;border:0;border-radius:8px;background:#1f050a}
</style>
</head>
<body>
  <div class="cadre">
    <div class="arche">
      <div class="interieur">
        <div class="mois">
          <button class="fleche" id="prec" type="button" aria-label="Mois précédent">‹</button>
          <h1 id="titre"></h1>
          <button class="fleche" id="suiv" type="button" aria-label="Mois suivant">›</button>
        </div>
        <div class="grille" id="grille"></div>
        <div class="detail">
          <h2 id="jour-titre"></h2>
          <ul class="liste" id="liste"></ul>
          <div class="ajout">
            <input id="texte" type="text" placeholder="Ajouter…" maxlength="60">
            <button id="ajouter" type="button" aria-label="Ajouter">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="musique">
    <div class="deco" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M9 3v11.6A3.5 3.5 0 1 0 11 17.5V8h8v6.6a3.5 3.5 0 1 0 2 3.1V3H9z"/></svg>
      <span>♪</span><span>♫</span>
    </div>
    <iframe src="https://open.spotify.com/embed/playlist/5JQVVSnYVqK1BqbHuy6LvZ?utm_source=generator&theme=0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy" title="Lecteur Spotify"></iframe>
  </div>

<script>
  const CLE = 'agenda-evenements';
  let evenements = {};
  try { evenements = JSON.parse(localStorage.getItem(CLE)) || {}; } catch (e) {}
  const sauver = () => { try { localStorage.setItem(CLE, JSON.stringify(evenements)); } catch (e) {} };
  const pad = n => String(n).padStart(2, '0');
  const cleDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const aujourdhui = new Date(); aujourdhui.setHours(0, 0, 0, 0);
  let vue = new Date(aujourdhui.getFullYear(), aujourdhui.getMonth(), 1);
  let choisi = new Date(aujourdhui);
  const grille = document.getElementById('grille');

  function afficherMois() {
    document.getElementById('titre').textContent = vue.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    grille.innerHTML = ['L','M','M','J','V','S','D'].map(j => `<span class="nom-jour">${j}</span>`).join('');
    const decalage = (vue.getDay() + 6) % 7;
    const nbJours = new Date(vue.getFullYear(), vue.getMonth() + 1, 0).getDate();
    for (let i = 0; i < decalage; i++) grille.insertAdjacentHTML('beforeend', '<button class="jour autre" tabindex="-1" aria-hidden="true"></button>');
    for (let n = 1; n <= nbJours; n++) {
      const d = new Date(vue.getFullYear(), vue.getMonth(), n);
      const k = cleDate(d);
      const c = ['jour'];
      if (k === cleDate(aujourdhui)) c.push('aujourdhui');
      if (k === cleDate(choisi)) c.push('choisi');
      if (evenements[k] && evenements[k].length) c.push('evenement');
      grille.insertAdjacentHTML('beforeend', `<button class="${c.join(' ')}" type="button" data-k="${k}">${n}</button>`);
    }
  }
  function afficherJour() {
    const k = cleDate(choisi);
    document.getElementById('jour-titre').textContent = choisi.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const liste = document.getElementById('liste');
    const items = evenements[k] || [];
    liste.innerHTML = items.length
      ? items.map((t, i) => `<li><span></span><button type="button" data-i="${i}" aria-label="Supprimer">×</button></li>`).join('')
      : '<li class="vide">Rien de prévu</li>';
    liste.querySelectorAll('li span').forEach((s, i) => s.textContent = items[i]);
  }
  function tout() { afficherMois(); afficherJour(); }
  grille.addEventListener('click', e => {
    const k = e.target.dataset.k; if (!k) return;
    const [a, m, j] = k.split('-').map(Number);
    choisi = new Date(a, m - 1, j); tout();
  });
  document.getElementById('liste').addEventListener('click', e => {
    const i = e.target.dataset.i; if (i === undefined) return;
    const k = cleDate(choisi);
    evenements[k].splice(Number(i), 1);
    if (!evenements[k].length) delete evenements[k];
    sauver(); tout();
  });
  function ajouter() {
    const champ = document.getElementById('texte');
    const t = champ.value.trim(); if (!t) return;
    const k = cleDate(choisi);
    (evenements[k] = evenements[k] || []).push(t);
    champ.value = ''; sauver(); tout();
  }
  document.getElementById('ajouter').addEventListener('click', ajouter);
  document.getElementById('texte').addEventListener('keydown', e => { if (e.key === 'Enter') ajouter(); });
  document.getElementById('prec').addEventListener('click', () => { vue.setMonth(vue.getMonth() - 1); afficherMois(); });
  document.getElementById('suiv').addEventListener('click', () => { vue.setMonth(vue.getMonth() + 1); afficherMois(); });
  tout();
</script>
</body>
</html>
